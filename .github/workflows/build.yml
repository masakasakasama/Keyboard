name: Build APK

on:
  push:
    branches: ['claude/android-keyboard-app-tHMVN', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set versionCode from commit count
        run: |
          VC=$(git rev-list --count HEAD)
          echo "VC=$VC" >> "$GITHUB_ENV"
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/" app/build.gradle.kts

      - name: Build Debug APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          export PATH="/opt/gradle/gradle-8.6/bin:$PATH"
          gradle :app:assembleDebug --stacktrace

      - name: Publish Release
        run: |
          TAG="v$VC"
          NOTES="versionCode=$VC

          ## インストール / アップデート手順
          1. **MyKeyboard.apk** をタップ → ダウンロード
          2. タップしてインストール（初回のみ「提供元不明アプリ」を許可）
          3. 設定 → 一般管理 → キーボード → MyKeyboard を有効化
          4. デフォルトキーボードに設定"

          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#MyKeyboard.apk" \
            --title "MyKeyboard $TAG" \
            --notes "$NOTES" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
