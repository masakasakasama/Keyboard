name: Build APK

on:
  push:
    branches: ['claude/android-keyboard-app-tHMVN', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set versionCode from commit count
        run: |
          VC=$(git rev-list --count HEAD)
          echo "VC=$VC" >> "$GITHUB_ENV"
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/" app/build.gradle.kts

      - name: Install Gradle 8.6 and generate gradlew wrapper
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.6/bin/gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Publish Release
        if: success()
        run: |
          gh release create "v$VC" \
            "app/build/outputs/apk/debug/app-debug.apk#MyKeyboard.apk" \
            --title "MyKeyboard v$VC" \
            --notes "versionCode=$VC" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
